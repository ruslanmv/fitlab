# MEDIA LANE SEED — image and video generation models (bootstrap + curated facts only).
#
# The LLM lane sizes a model from its config.json; diffusion pipelines have no such single
# file, so their memory needs are declared here, with the source of every number recorded in
# `vram_gb.source`. Ranks are NOT curated: scripts/build_media.py computes them every week
# from these facts plus live Hugging Face download counts, under `media_ranking_version`.
#
#   vram_gb.min          lowest VRAM that runs the default workflow (offload / low-VRAM mode allowed)
#   vram_gb.recommended  VRAM for the native resolution without offloading
#   vram_gb.source       homepilot-presets  — HomePilot's video_presets.json model_min_vram
#                        editorial          — maintainer estimate from the reference ComfyUI workflow;
#                                             replace with `measured` once a community run lands
#   cost.steps/megapixels/frames  the default workflow's work per output, used only for the speed proxy
#   homepilot            how HomePilot installs it (POST /models/install); null when HomePilot's
#                        catalogue has no entry yet
#
# Only base / reference checkpoints belong here — not community fine-tunes.
schema_version: "1.0"

categories:
  image-12gb: { title: "Top image models — 12 GB GPU",      task: image, reference_gpu: rtx3060-12 }
  image-16gb: { title: "Top image models — 16 GB GPU",      task: image, reference_gpu: rtx4060ti-16 }
  image-24gb: { title: "Top image models — 24 GB GPU",      task: image, reference_gpu: rtx4090-24 }
  video-12gb: { title: "Top video models — 12 GB GPU",      task: video, reference_gpu: rtx3060-12 }
  video-16gb: { title: "Top video models — 16 GB GPU",      task: video, reference_gpu: rtx4060ti-16 }
  video-24gb: { title: "Top video models — 24 GB GPU",      task: video, reference_gpu: rtx4090-24 }

