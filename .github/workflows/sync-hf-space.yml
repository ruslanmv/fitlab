name: Sync to Hugging Face Space

on:
  push:
    branches: ["master"]
    paths:
      - "huggingface-space/**"
      - "site/registry.json"
      - ".github/workflows/sync-hf-space.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-space-sync-fitlab
  cancel-in-progress: false

env:
  HF_USERNAME: ruslanmv
  SPACE_NAME: fitlab

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Hugging Face credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing HF_TOKEN repository secret. Create a Hugging Face write token and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Validate Space metadata
        run: |
          set -euo pipefail
          SHORT_DESC=$(sed -n 's/^short_description:[[:space:]]*//p' huggingface-space/README.md | head -n 1)
          SHORT_DESC=${SHORT_DESC#\"}
          SHORT_DESC=${SHORT_DESC%\"}
          SHORT_DESC=${SHORT_DESC#\'}
          SHORT_DESC=${SHORT_DESC%\'}
          if [ -z "$SHORT_DESC" ]; then
            echo "::error::Missing short_description in huggingface-space/README.md"
            exit 1
          fi
          if [ "${#SHORT_DESC}" -gt 60 ]; then
            echo "::error::Hugging Face short_description must be 60 characters or fewer (got ${#SHORT_DESC})."
            exit 1
          fi
          echo "Space metadata OK: short_description is ${#SHORT_DESC}/60 characters."

      - name: Build static Space deploy tree
        run: |
          set -euo pipefail
          DEPLOY_DIR="$RUNNER_TEMP/hf-space"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          # Static Space metadata + premium leaderboard app.
          cp huggingface-space/README.md "$DEPLOY_DIR/README.md"
          cp huggingface-space/index.html "$DEPLOY_DIR/index.html"

          # Ship the current registry snapshot so the Space is self-contained.
          cp site/registry.json "$DEPLOY_DIR/registry.json"

          echo "Deploy tree:"
          find "$DEPLOY_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Push static leaderboard to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="$RUNNER_TEMP/hf-space"
          REMOTE_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}"

          cd "$DEPLOY_DIR"
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy FitLab leaderboard from ${GITHUB_SHA::8}"

          echo "Pushing static leaderboard → https://huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}"
          git push --force "$REMOTE_URL" main

      - name: Deployment summary
        run: |
          echo "### ✅ Hugging Face Space synced" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: https://huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`huggingface-space/\` + \`site/registry.json\`" >> "$GITHUB_STEP_SUMMARY"
