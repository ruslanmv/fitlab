# Weekly single-model benchmark on a FREE GPU + weekly stack-compat verification.
#
# GPU lane  → Kaggle Kernels API (T4 16 GB — the same GPU class as Colab free tier; free Colab has
#             no headless API, so Kaggle is the ToS-compliant automation path; Colab stays the
#             human one-click channel via colab/benchmark_colab.ipynb).
# CPU lane  → same benchmark on the Actions runner, so a datapoint lands even if Kaggle is unavailable.
# PLUGS lane→ latest Ollama + OllaBridge + LangGraph/CrewAI/Langflow/Langfuse/DeepAgents + top-10
#             PyPI, exercised end-to-end against a real 0.6 B model on CPU.
#
# Secrets: KAGGLE_USERNAME, KAGGLE_API_TOKEN (kaggle.com → Settings → API → Generate New Token).
#   KAGGLE_API_TOKEN is the current variable and the only one that accepts a `KGAT_…` token;
#   KAGGLE_KEY is read as a LEGACY_API_KEY and fails against one. Both are passed through, so
#   an older key still works if that is what the repository has.
name: weekly-benchmark

on:
  schedule:
    - cron: "17 3 * * 1"          # Mondays 03:17 UTC (off the :00 rush)
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama tag to benchmark (blank = weekly rotation)"
        required: false

concurrency:
  group: weekly-benchmark
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pick-model:
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.pick.outputs.model }}
      model_id: ${{ steps.pick.outputs.model_id }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        name: Rotate through the registry (week number % queue length)
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, pathlib, os
          override = os.environ.get("INPUT_MODEL", "").strip()
          reg = json.loads(pathlib.Path("data/registry.json").read_text()) \
                if pathlib.Path("data/registry.json").exists() else None
          by_tag = {m["ollama_tag"]: mid for mid, m in (reg or {}).get("models", {}).items()
                    if m.get("ollama_tag")}
          if override:
              print(f"model={override}")
              print(f"model_id={by_tag.get(override, '')}")
              raise SystemExit
          if reg:
              ids = [t["id"] for t in reg["categories"]["colab-free"]["top"]]
              queue = [(reg["models"][i].get("ollama_tag"), i) for i in ids]
              queue = [(t, i) for t, i in queue if t]
          else:
              queue = [("qwen3:8b", "qwen3-8b"), ("phi4:14b", "phi-4"),
                       ("gemma3:12b", "gemma-3-12b"), ("deepseek-r1:14b", "deepseek-r1-14b")]
          week = datetime.date.today().isocalendar().week
          tag, mid = queue[week % len(queue)]
          print(f"model={tag}")
          print(f"model_id={mid}")
          PY
        env:
          INPUT_MODEL: ${{ inputs.model }}

  gpu-kaggle:
    needs: pick-model
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Check Kaggle credentials
        id: kaggle-auth
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || { [ -z "$KAGGLE_API_TOKEN" ] && [ -z "$KAGGLE_KEY" ]; }; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Kaggle GPU lane skipped: KAGGLE_USERNAME plus KAGGLE_API_TOKEN (or legacy KAGGLE_KEY) are not configured."
            {
              echo "### ⚠ Kaggle GPU lane skipped"
              echo "Add **KAGGLE_USERNAME** and **KAGGLE_API_TOKEN** repository secrets to restore weekly T4 measurements."
              echo "Generate the token at kaggle.com → Settings → API → Generate New Token."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Kaggle auth: ${KAGGLE_API_TOKEN:+KAGGLE_API_TOKEN}${KAGGLE_API_TOKEN:-legacy KAGGLE_KEY} as $KAGGLE_USERNAME"
          fi

      - if: steps.kaggle-auth.outputs.configured == 'true'
        run: pip install "kaggle>=1.6" jsonschema

      - name: Render Kaggle kernel (runs scripts/bench_gguf.py on a free T4)
        if: steps.kaggle-auth.outputs.configured == 'true'
        env:
          MODEL: ${{ needs.pick-model.outputs.model }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kernel
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/bench_gguf.py"
          cat > kernel/fitlab_bench.py <<EOF
          import os, subprocess, urllib.request
          urllib.request.urlretrieve("${RAW}", "bench_gguf.py")
          os.environ["FITLAB_ENV"] = "kaggle"
          os.environ["RUN_URL"] = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          subprocess.run(["python", "bench_gguf.py", "--model", "${MODEL}",
                          "--model-id", "${{ needs.pick-model.outputs.model_id }}",
                          "--out", "/kaggle/working", "--source", "ci-kaggle", "--reps", "3"], check=True)
          EOF
          cat > kernel/kernel-metadata.json <<EOF
          { "id": "${KAGGLE_USERNAME}/llm-fitlab-weekly",
            "title": "llm fitlab weekly",
            "code_file": "fitlab_bench.py",
            "language": "python", "kernel_type": "script",
            "is_private": true, "enable_gpu": true, "enable_internet": true }
          EOF

      - name: Push kernel and wait for the free T4 to finish
        if: steps.kaggle-auth.outputs.configured == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          KERNEL=$(python -c "import json;print(json.load(open('kernel/kernel-metadata.json'))['id'])")
          kaggle kernels push -p kernel

          # The push prints the URL Kaggle actually created. If the title ever stops
          # resolving to the id, poll what exists rather than what we asked for.
          if ! kaggle kernels status "$KERNEL" >/dev/null 2>&1; then
            echo "::error::Kaggle did not create $KERNEL — check the kernel title still slugs to the id."
            exit 1
          fi

          for i in $(seq 1 60); do
            sleep 60
            STATUS=$(kaggle kernels status "$KERNEL" 2>/dev/null || echo pending)
            echo "[$i] $STATUS"
            case "$STATUS" in
              *complete*) break ;;
              *error*|*cancel*)
                echo "::error::Kaggle run failed — log follows"
                mkdir -p out && kaggle kernels output "$KERNEL" -p out || true
                for f in out/*.log; do [ -f "$f" ] && tail -c 4000 "$f"; done
                exit 1 ;;
            esac
          done
          mkdir -p out && kaggle kernels output "$KERNEL" -p out
          ls -la out

      - name: Validate against schema and stage result
        if: steps.kaggle-auth.outputs.configured == 'true'
        run: |
          python - <<'PY'
          import json, glob, pathlib, jsonschema
          files = glob.glob("out/**/*.json", recursive=True)
          assert files, "no result JSON returned from Kaggle"
          result = json.loads(pathlib.Path(files[0]).read_text())
          schema = json.loads(pathlib.Path("data/schema/benchmark.schema.json").read_text())
          jsonschema.validate(result, schema)
          dest = pathlib.Path("data/benchmarks") / pathlib.Path(files[0]).name
          dest.write_text(json.dumps(result, indent=2))
          print("✓ staged", dest, "| gpu:", result["gpu"]["name"], "| tps:", result["metrics"]["gen_tps"])
          PY

      - if: steps.kaggle-auth.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with: { name: gpu-result, path: data/benchmarks/*.json, if-no-files-found: ignore }

  cpu-fallback:
    needs: pick-model
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Benchmark a small model on the runner CPU (guaranteed weekly datapoint)
        env:
          FITLAB_ENV: actions
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/bench_gguf.py --model qwen3:0.6b --model-id qwen3-0.6b \
            --out data/benchmarks --source ci-actions-cpu --reps 3
      - uses: actions/upload-artifact@v4
        with: { name: cpu-result, path: data/benchmarks/*.json }

  plugs-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install this week's LATEST stack (deliberately unpinned — latest IS the test)
        run: |
          pip install --upgrade pip
          pip install ollabridge langgraph langchain langchain-openai crewai langflow \
                      langfuse deepagents "agent-matrix-lab" \
                      torch --index-url https://download.pytorch.org/whl/cpu || true
          pip install transformers openai huggingface_hub fastapi pydantic numpy pandas httpx requests pyyaml
          pip freeze > this-week-pins.txt
      - name: Run end-to-end probes (framework → OllaBridge → Ollama → qwen3:0.6b)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/compat_probe.py --report data/compat_report.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: |
            data/compat_report.json
            this-week-pins.txt

  commit-results:
    needs: [pick-model, gpu-kaggle, cpu-fallback, plugs-compat]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: incoming, merge-multiple: true }

      - name: Merge artifacts and rebuild registry
        run: |
          pip install pyyaml
          # Only date-prefixed benchmark result files belong in data/benchmarks.
          find incoming -maxdepth 1 -type f -name '20??-??-??_*.json' -exec cp {} data/benchmarks/ \;
          [ -f incoming/compat_report.json ] && cp incoming/compat_report.json data/compat_report.json || true
          python scripts/sync_hf.py
          # Never let the transient Actions download directory leak into the PR.
          rm -rf incoming
          pip install jsonschema
          python scripts/validate_data.py

      - name: Open results PR (automation never pushes to main)
        id: results-pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/weekly-benchmark
          title: "bench: weekly results — ${{ needs.pick-model.outputs.model || 'rotation' }}"
          commit-message: "bench: weekly GPU/CPU results + compat report"
          body: |
            Automated weekly run.

            - GPU lane: Kaggle T4 16 GB (Colab-free class), when Kaggle credentials are configured.
            - CPU lane: GitHub Actions runner.
            - PLUGS: latest-version stack probed end-to-end.
            - Registry: rebuilt with measured results and current Hugging Face metadata.

            Review the diff in `data/` and merge.
          labels: bot, benchmark
          delete-branch: true

      - name: Explain blocked PR creation
        if: steps.results-pr.outcome != 'success'
        run: |
          echo "### ⚠ Results branch updated but PR creation was blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow can still preserve benchmark data on \`bot/weekly-benchmark\`." >> "$GITHUB_STEP_SUMMARY"
          echo "To let Actions open the PR automatically, enable **Allow GitHub Actions to create and approve pull requests** in repository Actions settings." >> "$GITHUB_STEP_SUMMARY"
