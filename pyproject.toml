[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitlab"
version = "0.1.0"
description = "Will it run on my setup? Fit-check + benchmark wizard for local LLMs on your GPU — weekly-updated model registry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ruslan Magana Vsevolodovna" }]
keywords = ["llm", "ollama", "benchmark", "vram", "gpu", "local-ai", "colab"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/OWNER/llm-fitlab"
"Live radar" = "https://OWNER.github.io/llm-fitlab/"

[project.scripts]
fitlab = "fitlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fitlab"]
